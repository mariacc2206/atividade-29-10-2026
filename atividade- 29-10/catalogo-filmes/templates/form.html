
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Filmes</title>
</head>
<body>
    <h1>
        {% if filme %}
            Editar Filme
        {% else %}
            Cadastrar Filme
        {% endif %}
    </h1>

    <form method="POST">
        <label for="titulo">Título do filme:</label>
        <input type="text" id="titulo" name="titulo"
               value="{{ filme.titulo if filme else '' }}" required>
        <br><br>

        <label for="genero">Gênero:</label>
        <input type="text" id="genero" name="genero"
               value="{{ filme.genero if filme else '' }}" required>
        <br><br>

        <label for="ano">Ano de lançamento:</label>
        <input type="number" id="ano" name="ano"
               value="{{ filme.ano if filme else '' }}"
               min="1888" max="2100" required>
        <br><br>

        <label for="nota">Nota de 1 a 10:</label>
        <input type="number" id="nota" name="nota"
               value="{{ filme.nota if filme else '' }}"
               min="1" max="10" step="0.1" required>
        <br><br>

        <button type="submit">Salvar Filme</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">Voltar para a lista</a>
</body>
</html>
